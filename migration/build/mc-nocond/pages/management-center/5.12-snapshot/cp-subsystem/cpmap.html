<div class="paragraph">
<p>You can see a list of all the <a href="../../../hazelcast/5.8-snapshot/data-structures/cpmap" class="xref page">CPMaps</a> in your cluster
by clicking on the <strong>CPMaps</strong> menu item in the left menu.</p>
</div>
<div class="paragraph">
<p><span class="image"><img src="../_images/CPMaps.png" alt="CPMaps View"></span></p>
</div>
<div class="paragraph">
<p>A CPMap has two metrics:</p>
</div>
<div class="ulist">
<ul>
<li>
<p><strong>Entries</strong>: The number of entries in the map</p>
</li>
<li>
<p><strong>Size</strong>: The size of the map in memory</p>
</li>
</ul>
</div>
<div class="paragraph">
<p>Sort the table by clicking on the column headers.</p>
</div>
