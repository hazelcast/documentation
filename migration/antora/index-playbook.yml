asciidoc:
  attributes:
    page-component-order: '!home, !templates, !imdg, !privacy, !jdbc-driver, hazelcast, management-center, operator, cloud, *'
    page-excluded-versions: ''
    page-last-versions-count: 6
    page-pagination: true@
    page-experimental: true
    idprefix: ''
    idseparator: '-'
    # Global string/URL attributes copied verbatim from the production playbook,
    # so rendered content matches production (e.g. {hazelcast-cloud}, {ucn}).
    imdg-javadoc: https://docs.hazelcast.org/docs/latest-dev/javadoc
    imdg-samples: https://github.com/hazelcast/hazelcast-code-samples
    imdg-core: https://github.com/hazelcast/hazelcast/tree/master/hazelcast/src/main/java/com/hazelcast
    imdg-docs: https://docs.hazelcast.org/docs/latest/manual/html-single/index.html
    imdg-ops-guide: https://hazelcast.com/resources/hazelcast-deployment-operations-guide/
    jet-docs: https://jet-start.sh/
    docs-archive: 'https://hazelcast.org/imdg/download/archives/'
    hazelcast-cloud: Cloud
    page-cloud-console: https://cloud.hazelcast.com/
    ucn: User Code Namespaces
    ucd: User Code Deployment
  # Asciidoctor extensions matter only for the snapshot's document conversion,
  # not the index pass. tabs-block is required for faithful rendering (hz-docs
  # main uses [tabs] in 162 files). Deferred: swagger-ui-block-macro (6 pages, a
  # separate category needing a token) and asciidoctor-kroki (renders diagrams
  # via an external Kroki server — network + reproducibility concerns).
  # Referenced as a module name (no .js) so Antora resolves it via node's
  # module resolution (walks up to migration/node_modules), rather than as a
  # path relative to this playbook's dir.
  extensions:
    - hazelcast-docs-tools/antora-macro/tabs-block
