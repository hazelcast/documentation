# Index-pass playbook: scoped to the MIGRATED component set only (the ~57 guides
# repos and hazelcast-code-samples stay external on Antora for now, so they are
# omitted). URL settings mirror the production hazelcast-docs playbook exactly so
# the pub URLs recorded in manifest.json are the real current URLs.
#
# Reads from bare MIRROR clones under .sources/ (runtime.fetch: false). The
# mirrors are migration-owned and frozen: they never touch local working clones,
# and they do not move until deliberately updated, so the pinned SHAs stay fixed
# regardless of branch activity anywhere (local or origin). This is what makes
# the baseline reproducible. Populate/refresh the mirrors from `migration/`:
#   git clone  --mirror https://github.com/hazelcast/<repo>.git .sources/<repo>.git   # once
#   git -C .sources/<repo>.git remote update --prune                                  # to advance
site:
  title: Documentation
  url: https://docs.hazelcast.com
  start_page: home::index.adoc
urls:
  html_extension_style: drop
# The index pass never loads the UI, but the playbook schema requires a bundle
# url; this placeholder is never fetched (no site generator, no convert).
ui:
  bundle:
    url: ./ui-bundle-unused.zip
runtime:
  fetch: false
  cache_dir: ./.cache
content:
  sources:
    - url: .sources/hazelcast-docs.git
      # 'tutorials' is a RESOLUTION-ONLY component (not migrated): built so the
      # migrated set's xrefs into it resolve to /tutorials/... URLs as production
      # does. It is assembled from hazelcast-docs/tutorials + cloud-docs/tutorials.
      start_paths: [home, privacy, tutorials]
      branches: [main]
    - url: .sources/hz-docs.git
      branches: [main, v/*]
      start_path: docs
    # 'imdg' is a RESOLUTION-ONLY component (legacy, not migrated): built-but-
    # hidden (!imdg in page-component-order) so the 233 xrefs into it from the
    # migrated set resolve to /imdg/... URLs as production does. Its
    # archived-versions branch is skipped (as with management-center).
    - url: .sources/imdg-docs.git
      branches: [v/*]
      start_path: docs
    # management-center also has an 'archived-versions' branch holding pre-2020
    # versions as subdirs; intentionally skipped (~5 years old, out of scope).
    - url: .sources/management-center-docs.git
      branches: [main, v/*]
      start_path: docs
    - url: .sources/clc-docs.git
      branches: [v/*]
      start_path: docs
    - url: .sources/hazelcast-platform-operator-docs.git
      branches: [main, v/*]
      start_path: docs
    - url: .sources/cloud-docs.git
      branches: [main]
      # docs = migrated cloud component; tutorials = resolution-only (merges into
      # the 'tutorials' component alongside hazelcast-docs/tutorials).
      start_paths: [docs, tutorials]
    # The 'cloud' component is assembled from TWO repos: cloud-docs (above) +
    # hazelcast-cloud-maven-plugin, which declares name: cloud and provides the
    # maven-plugin-hazelcast page that cloud-docs pages xref. Both are migrated.
    - url: .sources/hazelcast-cloud-maven-plugin.git
      branches: [main]
      start_path: docs
    # jdbc-driver is an exclusion candidate; included here so the manifest holds
    # its URLs and we can check for inbound xrefs from the migrated set.
    - url: .sources/jdbc-driver-docs.git
      branches: [main]
      start_path: docs
    # --- 'tutorials' component: the 56 hazelcast-guides/* repos (each declares
    # name: tutorials). REMOTE + resolution-only: cloned once into .cache under
    # fetch:false and frozen (nobody edits them). Present so the migrated set's
    # xref:tutorials:* links resolve as production does; their pages are NOT
    # migrated (see build-snapshot.js migrated-component allowlist). ---
    - url: https://github.com/hazelcast-guides/user-code-namespaces
