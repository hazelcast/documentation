[build]
  command = "npm run build"
  publish = "build"

# The Cloud console fetches api/cloud.json cross-origin.
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# The Antora site published a sitemap index with one sitemap per component; this site has a single sitemap.
[[redirects]]
  from = "/sitemap-clc.xml"
  to = "/sitemap.xml"
  status = 301
[[redirects]]
  from = "/sitemap-cloud.xml"
  to = "/sitemap.xml"
  status = 301
[[redirects]]
  from = "/sitemap-hazelcast.xml"
  to = "/sitemap.xml"
  status = 301
[[redirects]]
  from = "/sitemap-home.xml"
  to = "/sitemap.xml"
  status = 301
[[redirects]]
  from = "/sitemap-imdg.xml"
  to = "/sitemap.xml"
  status = 301
[[redirects]]
  from = "/sitemap-jdbc-driver.xml"
  to = "/sitemap.xml"
  status = 301
[[redirects]]
  from = "/sitemap-management-center.xml"
