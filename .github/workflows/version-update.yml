name: Version update
run-name: ${{ github.workflow }} (${{ inputs.component }} `${{ inputs.version }}`)

# Opens a PR with the docs changes for a product release. See README.md "Releasing a version".
on:
  workflow_dispatch:
    inputs:
      component:
        description: 'Product being released'
        required: true
        type: choice
        options:
          - hazelcast
          - management-center
          - operator
          - clc
      version:
        description: 'Version being released, e.g. 5.11.2'
        required: true
      next-snapshot:
        description: 'Platform or Management Center major/minor release only: the new development version, e.g. 6.1.0-SNAPSHOT'
        required: false
      next-release:
        description: 'Operator only, every release: the next planned release, e.g. 5.21.0'
        required: false
      supported-hazelcast:
        description: 'Operator only, optional: newest Platform version this release supports, e.g. 5.7.1. Blank keeps the current value.'
        required: false
      supported-mc:
        description: 'Operator only, optional: newest Management Center version this release supports, e.g. 5.11.1. Blank keeps the current value.'
        required: false
      merge:
        description: 'Merge the PR automatically once its checks pass'
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    env:
      COMPONENT: ${{ inputs.component }}
      VERSION: ${{ inputs.version }}
      TITLE: Update ${{ inputs.component }} to ${{ inputs.version }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          # Push with GH_TOKEN: a PR opened with GITHUB_TOKEN triggers no workflows, so its checks would never run.
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Close an earlier PR for this release
        run: |
          gh pr list --state open --search "\"${TITLE}\" in:title" --json number,title,headRefName \
            --jq '.[] | select(.title == env.TITLE and (.headRefName | startswith("update_"))) | .number' |
          while read -r number; do
            gh pr close "${number}" --delete-branch \
              --comment "Replaced by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          done

      - name: Update versions
        id: update
        run: |
          if [[ -n "${NEXT_SNAPSHOT}" && -n "${NEXT_RELEASE}" ]]; then
            echo "::error::Set next-snapshot or next-release, not both"
            exit 1
          fi
          args=("${COMPONENT}" "${VERSION}")
          next="${NEXT_SNAPSHOT:-${NEXT_RELEASE}}"
          [[ -n "${next}" ]] && args+=(--next "${next}")
          [[ -n "${SUPPORTED_HAZELCAST}" ]] && args+=(--hazelcast "${SUPPORTED_HAZELCAST}")
          [[ -n "${SUPPORTED_MC}" ]] && args+=(--mc "${SUPPORTED_MC}")
          node .github/scripts/version-update "${args[@]}"
        env:
          NEXT_SNAPSHOT: ${{ inputs.next-snapshot }}
          NEXT_RELEASE: ${{ inputs.next-release }}
          SUPPORTED_HAZELCAST: ${{ inputs.supported-hazelcast }}
          SUPPORTED_MC: ${{ inputs.supported-mc }}

      - name: Open PR
        id: pr
        if: steps.update.outputs.changes == 'true'
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          branch="update_${COMPONENT}_${VERSION}_${GITHUB_RUN_ID}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git checkout -b "${branch}"
          git add -A
          git commit --message "${TITLE}" --message "Generated by ${run_url}."
          git push -u origin "${branch}"
          url=$(gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --title "${TITLE}" \
            --body "Version update for the ${COMPONENT} ${VERSION} release, generated by ${run_url}.")
          echo "url=${url}" >> "${GITHUB_OUTPUT}"

      # Checks must pass: a red check on a version update means a broken site would go live.
      - name: Merge the PR
        if: inputs.merge && steps.pr.outputs.url != ''
        run: |
          url="${{ steps.pr.outputs.url }}"
          if ! checks=$(gh pr checks "${url}" --watch --fail-fast 2>&1); then
            if grep -q "no checks reported" <<< "${checks}"; then
              echo "No checks reported on ${url}"
            else
              echo "${checks}"
              echo "::error::Checks on ${url} did not pass"
              exit 1
            fi
          fi
          gh pr merge "${url}" --squash --delete-branch
