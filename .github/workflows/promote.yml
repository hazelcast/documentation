name: Promote Release
run-name: ${{ github.workflow }} (Platform `${{ inputs.VERSION }}`@${{ inputs.ENVIRONMENT }})

on:
  # Called from the release orchestrator
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'The Platform version to promote (e.g. `5.7.1`)'
        required: true
      RELEASE_TYPE:
        description: 'What should be promoted'
        required: true
        type: choice
        options:
          - ALL
          - OSS
          - EE
      ENVIRONMENT:
        description: 'Environment to use'
        required: true
        type: environment

jobs:
  promote:
    environment:
      name: ${{ inputs.ENVIRONMENT }}
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ inputs.VERSION }}
      TITLE: Update Platform to ${{ inputs.VERSION }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Get release info
        id: get-rel-info
        uses: hazelcast/mono-actions/get-release-info@main
        with:
          release-version: ${{ inputs.VERSION }}
          github-token: ${{ secrets.GH_TOKEN }}

      - name: Find the PR
        id: find-pr
        run: |
          numbers=$(gh pr list --state open --search "\"${TITLE}\" in:title" --json number,title,headRefName \
            --jq '.[] | select(.title == env.TITLE and (.headRefName | startswith("update_platform_"))) | .number')
          if [[ $(grep -c . <<< "${numbers}") -gt 1 ]]; then
            echo "::error::More than one open PR titled '${TITLE}': $(tr '\n' ' ' <<< "${numbers}")"
            exit 1
          fi
          echo "number=${numbers}" >> "${GITHUB_OUTPUT}"

      - name: 'Merge PR #${{ steps.find-pr.outputs.number }}'
        if: steps.find-pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh pr ready ${{ steps.find-pr.outputs.number }}

          gh pr merge \
            ${{ steps.find-pr.outputs.number }} \
            --squash
