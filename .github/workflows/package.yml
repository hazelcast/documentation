name: Package Release
run-name: ${{ github.workflow }} (`${{ inputs.VERSION }}`@${{ inputs.ENVIRONMENT }})

# Opens the release's version bump as a draft PR; promote.yml merges it.
on:
  # Called from the release orchestrator
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'The version to build (e.g. `5.4.1`)'
        required: true
      RELEASE_TYPE:
        description: 'What should be built'
        required: true
        type: choice
        options:
          - ALL
          - OSS
          - EE
      ENVIRONMENT:
        description: 'Environment to use'
        required: true
        type: environment

jobs:
  package:
    environment:
      name: ${{ inputs.ENVIRONMENT }}
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ inputs.VERSION }}
      TITLE: Update main to ${{ inputs.VERSION }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          # Push with GH_TOKEN: a PR opened with GITHUB_TOKEN triggers no workflows, so its checks would never run.
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Get release info
        id: get-rel-info
        uses: hazelcast/mono-actions/get-release-info@main
        with:
          release-version: ${{ inputs.VERSION }}
          github-token: ${{ secrets.GH_TOKEN }}

      - name: Close an earlier PR for this release
        run: |
          gh pr list --state open --search "\"${TITLE}\" in:title" --json number,title,headRefName \
            --jq '.[] | select(.title == env.TITLE and (.headRefName | startswith("update_version_"))) | .number' |
          while read -r number; do
            gh pr close "${number}" --delete-branch \
              --comment "Replaced by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          done

      - name: Bump versions
        id: bump
        run: node .github/scripts/version-bump
        env:
          RELEASE_VERSION: ${{ inputs.VERSION }}
          REL_MAJOR_MINOR: ${{ steps.get-rel-info.outputs.rel-major-minor }}
          MASTER_VERSION: ${{ steps.get-rel-info.outputs.master-version }}
          MASTER_MAJOR_MINOR: ${{ steps.get-rel-info.outputs.master-major-minor }}
          MC_MAJOR_MINOR: ${{ steps.get-rel-info.outputs.mc-major-minor }}
          IS_PATCH_RELEASE: ${{ steps.get-rel-info.outputs.is-patch-release }}
          IS_REL_MAJOR_MINOR: ${{ steps.get-rel-info.outputs.is-rel-major-minor }}
          IS_LATEST_STABLE_RELEASE: ${{ steps.get-rel-info.outputs.is-latest-stable-release }}
          IS_BETA_RELEASE: ${{ steps.get-rel-info.outputs.is-beta-release }}

      - name: Open PR
        if: steps.bump.outputs.changes == 'true'
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          branch="update_version_${VERSION}_${GITHUB_RUN_ID}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git checkout -b "${branch}"
          git add -A
          git commit --message "${TITLE}" --message "Generated by ${run_url}."
          git push -u origin "${branch}"
          gh pr create --draft \
            --base "${{ github.event.repository.default_branch }}" \
            --title "${TITLE}" \
            --body "Version bump for the ${VERSION} release, generated by ${run_url}. The Promote Release workflow merges it."
