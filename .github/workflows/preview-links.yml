name: Deploy preview links

# Netlify sets this commit status when a deploy preview is ready. GitHub runs status workflows from the
# default branch, never from the PR, so this workflow doesn't run PR code.
on: status

jobs:
  comment:
    if: github.event.context == 'netlify/hazelcast-documentation/deploy-preview' && github.event.state == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Comment with links to changed pages
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '.[0].number')
          [ -n "$pr" ] || exit 0
          curl -fsS "$PREVIEW_URL/preview-pages.json" -o "$RUNNER_TEMP/pages.json" || exit 0
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$pr/files" --jq ".[].filename" > "$RUNNER_TEMP/files.txt"
          node .github/scripts/preview-links "$RUNNER_TEMP/files.txt" "$RUNNER_TEMP/pages.json" "$PREVIEW_URL" > "$RUNNER_TEMP/body.md"
          [ -s "$RUNNER_TEMP/body.md" ] || exit 0
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$pr/comments" --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("Direct preview link"))) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$RUNNER_TEMP/body.md" > /dev/null
          else
            gh pr comment "$pr" --body-file "$RUNNER_TEMP/body.md"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.sha }}
          PREVIEW_URL: ${{ github.event.target_url }}
