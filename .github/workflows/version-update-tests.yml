name: Version update tests

# Also on changes to the files the version update rewrites: the tests check they still round-trip.
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/scripts/version-update/**'
      - '.github/workflows/package.yml'
      - '.github/workflows/promote.yml'
      - '.github/workflows/version-update.yml'
      - '.github/workflows/version-update-tests.yml'
      - 'src/variables.ts'
      - 'src/redirects.ts'
      - 'src/currentVersions.json'
      - '*_versions.json'
      - 'static/_redirects'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm run test:version-update
