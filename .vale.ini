StylesPath = .vale
MinAlertLevel = suggestion
Packages = Google
Vocab = Hazelcast
# slug and id are URL paths, not prose
IgnoredScopes = code, text.frontmatter.slug, text.frontmatter.id

[*.{md,mdx}]
BasedOnStyles = Vale, Google, Hazelcast

# Turned off: replaced by a house rule, or not our style
Google.Acronyms = NO      # Hazelcast.Acronyms has the house exceptions
Google.Contractions = NO  # the guide says avoid contractions; Hazelcast.Contractions
Google.Headings = NO      # TODO sentence-case pass after cutover
Google.Latin = NO
Google.Quotes = NO        # logical punctuation outside quotes
Google.Timeless = NO      # Hazelcast.Timeless
Google.Units = NO         # Hazelcast.UnitSpacing, plus MiB etc.
Google.WordList = NO      # merged into Hazelcast.RecommendedWords
Google.WordListCase = NO
Google.We = NO
Vale.Spelling = NO        # Hazelcast.Spelling adds acronym plurals

# Levels: errors are for names, vocabulary casing, and broken markup
Google.DateFormat = warning
Google.EmDash = warning
Google.Exclamation = warning
Google.LyHyphens = warning
Google.OptionalPlurals = warning
Google.Ordinal = warning
Google.Spacing = warning
Vale.Avoid = warning
