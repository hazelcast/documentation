# Hyphenate before a noun: "a client-side cache"
extends: existence
message: "Hyphenate '%s' before a noun: 'client-side' or 'server-side'."
level: warning
ignorecase: true
tokens:
  - '(?:server|client) side(?= (?:cache|caching|code|application|library|component|configuration|config|setting|property|properties|API|bug|implementation|logic|filter|encryption|validation|listener|statistics|metrics?|certificate|keystore|truststore|SSL|TLS)s?\b)'
