# House word list; replaces Google.WordList and Google.WordListCase (their Google- and Android-specific entries dropped)
extends: substitution
message: "Consider using '%s' instead of '%s'"
ignorecase: true
level: warning
action:
  name: replace
swap:
  # Case-sensitive: the key's own capitalization is what's wrong
  '(?-i:Ajax)': AJAX
  '(?-i:authN)': authentication
  '(?-i:authZ)': authorization
  '(?-i:HTTPs)': HTTPS
  '(?-i:k8s)': Kubernetes
  '(?-i:SHA1)': SHA-1
  '(?-i:url)': URL
  '(?-i:World Wide Web)': web
  # From Google's word list
  "(?:API Console|dev|developer) key": API key
  "(?:cell ?phone|smart ?phone)": phone|mobile phone
  "(?:e-mail|Email|E-mail)": email
  "(?:file ?path|path ?name)": path
  '\bOauth2\.0\b|\bOAuth ?2\b(?!\.0)|\bOauth\b(?! ?2)': OAuth 2.0
  "(?:ok|Okay)": OK|okay
  "(?:WiFi|wifi)": Wi-Fi
  '3\-D': 3D
  "un(?:check|select)": clear
  a\.k\.a|aka: or|also known as
  approx\.: approximately
  autoupdate: automatically update
  chapter: documents|pages|sections
  check box: checkbox
  click on: click|click in
  data are: data is
  fewer data: less data
  file name: filename
  grayed-out: unavailable
  in order to: to
  open-source: open source
  regex: regular expression
  sign into: sign in to
  '(?<!single )sign-?on': single sign-on
  stylesheet: style sheet
  synch: sync
  tablename: table name
  vs\.: versus
  # House additions
  back[- ]ends?: backend
  front[- ]ends?: frontend
  (?:account name|accountname|user name): username
  (?:drop down|dropdown): drop-down
  adaptor: adapter
  administrate: administer
  afterwards: afterward
  alphabetic: alphabetical
  alphanumerical: alphanumeric
  anti-aliasing: antialiasing
  anti-malware: antimalware
  anti-spyware: antispyware
  anti-virus: antivirus
  appendixes: appendices
  assembler: assembly
  check boxes: checkboxes
  distro: distribution
  ergo: therefore
  keypress: keystroke
  mutices: mutexes
  repo: repository
  scroll: navigate
  wish: want
