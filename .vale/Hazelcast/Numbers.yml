# Spell out zero to nine in prose; numerals stay for versions, units, and values
extends: existence
message: "Spell out numbers from zero to nine in prose: '%s'."
level: suggestion
nonword: true
tokens:
  - '(?<![\w.$%/#:=+-])[0-9] (?!(?:seconds?|minutes?|hours?|days?|milliseconds?|bytes?|percent|times|cores?|vCPUs?|CPUs?|GB|MB)\b)[a-z]{3,}s\b'
